<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cendro — offline</title>
<style>
  :root {
    --chrome: #eef0f1;
    --surface: #ffffff;
    --ink: #1f2020;
    --ink-muted: #6d7174;
    --hairline: #e3e5e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --chrome: #26282b;
      --surface: #2b2d30;
      --ink: #efefec;
      --ink-muted: #a9a59d;
      --hairline: #39393c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--chrome);
    color: var(--ink);
    font-family: Inter, -apple-system, blinkmacsystemfont, "Segoe UI", helvetica, arial, sans-serif;
  }
  main {
    width: min(340px, 100%);
    padding: 28px 24px;
    border: 1px solid var(--hairline);
    border-radius: 14px;
    background: var(--surface);
    text-align: center;
  }
  img { width: 56px; height: 56px; border-radius: 12px; }
  h1 { margin: 16px 0 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  p { margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink-muted); }
  button {
    margin-top: 20px;
    width: 100%;
    height: 40px;
    border: 1px solid var(--hairline);
    border-radius: 9px;
    background: var(--ink);
    color: var(--chrome);
    font: inherit;
    font-weight: 550;
    cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Cendro" />
  <h1>You&rsquo;re offline</h1>
  <p>Cendro needs a connection to load your workspace. Reconnect, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
